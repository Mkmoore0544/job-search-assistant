services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
  dashboard:
    build: .
    command: python -m streamlit run app/dashboard/app.py --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
